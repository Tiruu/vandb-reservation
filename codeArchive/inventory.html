<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks | Gestion Tireuses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <img src="medias/logo-vandb-noir-plein.png" alt="" style="width: 5rem;">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Réservations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html">Calendrier</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="inventory.html">Stocks</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Gestion des Stocks</h2>

        <!-- Sélection de la semaine -->
        <div class="mb-3">
            <label for="weekStartDate" class="form-label">Date de dernière livraison</label>
            <input type="date" id="weekStartDate" class="form-control">
        </div>

        <!-- Beer Stock Table -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Fûts de Bière</h5>
                <button class="btn btn-sm btn-success" id="addBeerTypeBtn">+ Ajouter un type de fût</button>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Type de Fût</th>
                            <th>Stock Théorique</th>
                            <th>Quantité réservée (période de 2 semaines depuis livraison)</th>
                            <th>Stock Réel</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                            <!-- Contenu généré dynamiquement -->
                    </tbody>
                    </table>
            </div>
        </div>

        <!-- Equipment Stock Table -->
        <!-- Équipements -->
<table class="table table-striped">
    <thead>
        <tr>
            <th>Équipement</th>
            <th>Disponible</th>
            <th>Loué</th>
            <th>Dates Louées</th> <!-- Nouvelle colonne -->
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Barnum 3x3</td>
            <td id="barnum3x3-available">1</td>
            <td id="barnum3x3-rented">0</td>
            <td id="barnum3x3-dates">-</td> <!-- Affichage des dates -->
        </tr>
        <tr>
            <td>Barnum 3x6</td>
            <td id="barnum3x6-available">1</td>
            <td id="barnum3x6-rented">0</td>
            <td id="barnum3x6-dates">-</td> <!-- Affichage des dates -->
        </tr>
        <tr>
            <td>Borne Photo</td>
            <td id="photobooth-available">1</td>
            <td id="photobooth-rented">0</td>
            <td id="photobooth-dates">-</td> <!-- Affichage des dates -->
        </tr>
    </tbody>
</table>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/inventory.js"></script>
    <script src="scripts/database.js"></script>
</body>
</html>
