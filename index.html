<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Réservations | Gestion Tireuses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/main.css">
	<link rel="icon" type="image/png" href="medias/logo-vandb-noir-plein.png" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <img src="medias/logo-vandb-noir-plein.png" alt="" style="width: 5rem;">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Réservations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html">Calendrier</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="inventory.html">Stocks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="settings.html">Paramètres</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <h2 class="mb-4">Gestion des Réservations</h2>
        <button class="btn btn-success mb-3" id="addReservationBtn">+ Ajouter une Réservation</button>

        <!-- Accordéon pour les réservations -->
        <div class="accordion" id="reservationsAccordion">
            <!-- Accordéon des réservations annuelles -->
            <div class="accordion-item">
                <h2 class="accordion-header" id="annualReservationsHeader">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#annualReservationsCollapse" aria-expanded="true" aria-controls="annualReservationsCollapse">
                        Réservations Annuelles <span class="badge bg-success ms-2">0</span>
                    </button>
                </h2>
                <div id="annualReservationsCollapse" class="accordion-collapse collapse show" aria-labelledby="annualReservationsHeader" data-bs-parent="#reservationsAccordion">
                    <div class="accordion-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped mb-0">
                                <thead>
                                    <tr>
                                        <th>Client</th>
                                        <th>Téléphone</th>
                                        <th>Début</th>
                                        <th>Fin</th>
                                        <th>Tireuse</th>
                                        <th>Fûts</th>
                                        <th>Options</th>
                                        <th>Commentaires</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="annualReservationsTableBody">
                                    <!-- Les réservations annuelles seront injectées ici -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Accordéon des réservations classiques -->
            <div class="accordion-item mb-5">
                <h2 class="accordion-header" id="regularReservationsHeader">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#regularReservationsCollapse" aria-expanded="true" aria-controls="regularReservationsCollapse">
                        Réservations Classiques <span class="badge bg-primary ms-2">0</span>
                    </button>
                </h2>
                <div id="regularReservationsCollapse" class="accordion-collapse collapse show" aria-labelledby="regularReservationsHeader" data-bs-parent="#reservationsAccordion">
                    <div class="accordion-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped mb-0">
                                <thead>
                                    <tr>
                                        <th>Client</th>
                                        <th>Téléphone</th>
                                        <th>Début</th>
                                        <th>Fin</th>
                                        <th>Tireuse</th>
                                        <th>Fûts</th>
                                        <th>Options</th>
                                        <th>Commentaires</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="regularReservationsTableBody">
                                    <!-- Les réservations classiques seront injectées ici -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal pour ajouter/modifier une réservation -->
    <div class="modal fade" id="reservationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nouvelle Réservation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="reservationForm">
                        <div class="row">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="annualReservation">
                                <label class="form-check-label" for="annualReservation">Réservation Annuelle</label>
                            </div>
                            <div class="col-md-6">
                                <label>Nom du Client</label>
                                <input type="text" id="clientName" class="form-control" required>
                                <label>Téléphone</label>
                                <input type="tel" id="clientPhone" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label>Date de début</label>
                                <input type="date" id="startDate" class="form-control" required>
                                <label>Date de fin</label>
                                <input type="date" id="endDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label>Type de Tireuse</label>
                                <select id="tapType" class="form-select">
                                    <option value="">Choisir un type de tireuse...</option>
                                    <option value="FS">Froid Sec</option>
                                    <option value="T1">Trappiste 1</option>
                                    <option value="T2">Trappiste 2</option>
                                    <option value="Tonneau">Tonneau</option>
                                    <option value="Bertha">Bertha</option>
                                    <option value="Festoche">Festoche</option>
                                    <option value="Picolo">Picolo</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label>Numéro de Tireuse</label>
                                <select id="tapNumber" class="form-select">
                                    <option value="" selected>Choisir une tireuse...</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-12">
                                <label>Types de Fûts et Quantités</label>
                                <div id="beerContainer">
                                    <!-- Les entrées de bière seront générées dynamiquement -->
                                </div>
                                <button type="button" class="btn btn-secondary mt-2" id="addBeer">+ Ajouter un type de fût</button>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-12">
                                <label>Commentaire</label>
                                <textarea id="comment" class="form-control" rows="3" placeholder="Ajoutez un commentaire..."></textarea>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="barnumOption">
                                    <label class="form-check-label" for="barnumOption">Barnum 3x3</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="barnum2Option">
                                    <label class="form-check-label" for="barnum2Option">Barnum 3x6</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="photoBoothOption">
                                    <label class="form-check-label" for="photoBoothOption">Borne Photo</label>
                                </div>
                            </div>
                            <!-- ✅ Colonne droite : Empiler les boutons verticalement en bas à droite -->
                            <div class="col-md-6 d-flex flex-column align-items-end">
                                <button type="button" class="btn btn-secondary mb-2" data-bs-dismiss="modal">Annuler</button>
                                <button type="button" class="btn btn-primary" id="saveReservation">Enregistrer</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
    <script src="scripts/reservations_combined.js"></script>
    <script src="scripts/database.js"></script>
</body>
</html>
